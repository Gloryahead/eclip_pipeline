# =============================================================================
# skipper_config_gse315406.yaml
# Skipper eCLIP pipeline configuration — ENCORE (GSE315406)
#
# Paper: "Comprehensive RNA-binding protein analyses using enhanced CLIP (ENCORE)"
# GEO:   GSE315406
#
# Targets:  57 RBPs (K562 and HepG2 cells)
# Protocol: ENCODE4 / eCLIP — single-end, 10 nt UMI at 5′ of the read.
#           Reference: Van Nostrand et al., 2017
#
# Genome: GRCh38 (hg38) + GENCODE v47 — reuses the index built for other human experiments.
#
# IMPORTANT: Run build_manifest_gse315406.py before submitting gse315406.slurm.
#            It generates config/manifest_gse315406.csv from NCBI metadata.
# =============================================================================

WORKDIR: "/xdisk/haining/maarowosegbe/eclip_pipeline/results/gse315406"
TMPDIR:  "/xdisk/haining/maarowosegbe/eclip_pipeline/tmp"
MANIFEST: "/home/u11/maarowosegbe/eclip_pipeline/config/manifest_gse315406.csv"
TOOL_DIR: "/home/u11/maarowosegbe/eclip_pipeline/skipper/tools"

# Reference files (hg38) — reuse the same index built for other human experiments
GFF: "/xdisk/haining/maarowosegbe/eclip_pipeline/references/hg38/gencode.v47.filtered.gff3.gz"
GENOME: "/xdisk/haining/maarowosegbe/eclip_pipeline/references/hg38/GRCh38.primary_assembly.genome.fa"
BLACKLIST: "/xdisk/haining/maarowosegbe/eclip_pipeline/references/encode_eclip_blacklist.bed"
PARTITION: "/xdisk/haining/maarowosegbe/eclip_pipeline/references/hg38/skipper_partition.bed"
FEATURE_ANNOTATIONS: "/xdisk/haining/maarowosegbe/eclip_pipeline/references/hg38/skipper_feature_annotations.tsv"
STAR_DIR: "/xdisk/haining/maarowosegbe/eclip_pipeline/references/hg38/star_index"
ACCESSION_RANKINGS: "/home/u11/maarowosegbe/eclip_pipeline/skipper/annotations/accession_type_ranking.txt"

# ENCODE4 eCLIP: 10 nt UMI at 5′ of the read; single-end
protocol: ENCODE4
UMI_SIZE: 10
INFORMATIVE_READ: 1

# Peak-calling parameters
# OVERDISPERSION_MODE: input — both IP and SMInput are deposited in GSE315406
OVERDISPERSION_MODE: "input"
GINI_CUTOFF: 0.9
NORMALIZATION_MODE: "new"
THRESHOLD_MIN: 2
DEFINITION_OF_REPRODUCIBILITY: "ALL"
HOMER: "homer"
