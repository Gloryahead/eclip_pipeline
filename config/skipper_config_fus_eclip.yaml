# =============================================================================
# skipper_config_fus_eclip.yaml
# Skipper eCLIP pipeline configuration — FUS eCLIP (user's own samples)
#
# Dataset : Lei Wang lab eCLIP, sequenced 2026-10-01 (run 9040-0003-10012026_153425)
# Target  : FUS (Fused in Sarcoma / TLS)
# Conditions:
#   FUS_healthy — sample 010 (healthy/wildtype), 1 IP rep + 1 SMInput rep
#   FUS_disease — sample 004 (ALS/disease state), 1 IP rep + 1 SMInput rep
#   FUS_remedy  — sample 002 (therapeutic/rescue), 1 IP rep + 1 SMInput rep
# Protocol: seCLIP — Eclipse BioInnovations eCLIP Library Prep Kit (= ENCODE4)
#            10 nt UMI at 5' of R1, R1 only used downstream
# Genome  : hg38 (GRCh38), GENCODE v47 — same index as Rhine et al. and G3BP1 test
# =============================================================================

WORKDIR: "/xdisk/haining/maarowosegbe/eclip_pipeline/results/fus_eclip"
TMPDIR:  "/xdisk/haining/maarowosegbe/eclip_pipeline/tmp"
MANIFEST: "/home/u11/maarowosegbe/eclip_pipeline/config/manifest_fus_eclip.csv"
TOOL_DIR: "/home/u11/maarowosegbe/eclip_pipeline/skipper/tools"

# Reference files — reuse hg38 index already built for Rhine et al.
GFF: "/xdisk/haining/maarowosegbe/eclip_pipeline/references/hg38/gencode.v47.filtered.gff3.gz"
GENOME: "/xdisk/haining/maarowosegbe/eclip_pipeline/references/hg38/GRCh38.primary_assembly.genome.fa"
BLACKLIST: "/xdisk/haining/maarowosegbe/eclip_pipeline/references/encode_eclip_blacklist.bed"
PARTITION: "/xdisk/haining/maarowosegbe/eclip_pipeline/references/hg38/skipper_partition.bed"
FEATURE_ANNOTATIONS: "/xdisk/haining/maarowosegbe/eclip_pipeline/references/hg38/skipper_feature_annotations.tsv"
STAR_DIR: "/xdisk/haining/maarowosegbe/eclip_pipeline/references/hg38/star_index"
ACCESSION_RANKINGS: "/home/u11/maarowosegbe/eclip_pipeline/skipper/annotations/accession_type_ranking.txt"

# Protocol parameters — Eclipse BioInnovations kit follows ENCODE4 exactly
protocol: ENCODE4
UMI_SIZE: 10
INFORMATIVE_READ: 1

# Peak-calling parameters
# OVERDISPERSION_MODE: input — use SMInput for overdispersion (we have matched SMInput)
OVERDISPERSION_MODE: "input"
GINI_CUTOFF: 0.9
NORMALIZATION_MODE: "new"
THRESHOLD_MIN: 2
# 3 biological conditions treated as 3 replicates (Skipper requires >=2 replicates).
# Peaks reproducible in >=2/3 conditions are stable FUS binding sites.
# Use per-condition BigWigs for differential FUS binding comparison across states.
DEFINITION_OF_REPRODUCIBILITY: 2
HOMER: ""
