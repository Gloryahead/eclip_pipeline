# =============================================================================
# eclip.yaml
# Single micromamba environment for eCLIP-seq analysis (Rhine et al. 2025).
# Contains every tool needed to run the full Skipper pipeline:
#   cutadapt → STAR → umi_tools → samtools → Skipper peak calling → HOMER → MultiQC
#
# Create with:
#   micromamba env create -f eclip.yaml
#
# Activate with:
#   micromamba activate eclip
# =============================================================================
name: eclip
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:

  # ── Python runtime ──────────────────────────────────────────────────────
  # 3.12: supported by both snakemake-executor-plugin-slurm (requires >=3.11)
  # and pysam/bioinformatics tools on bioconda
  - python=3.12

  # ── Adapter trimming ────────────────────────────────────────────────────
  # cutadapt removes the 3' RNA ligation adapter and low-quality bases.
  # ENCODE4 eCLIP adapter: AGATCGGAAGAGCACACGTCTGAACTCCAGTCAC
  - cutadapt=4.9
  - skewer                # se_trim_fastq rule in Skipper se_preprocess.smk

  # ── Alignment ───────────────────────────────────────────────────────────
  # STAR is the aligner used by Skipper and by the RNA-seq arm of the paper
  - star=2.7.11b

  # ── UMI deduplication ───────────────────────────────────────────────────
  # umi_tools extracts the 10 nt UMI and deduplicates PCR copies after
  # alignment. Non-negotiable for eCLIP: reads naturally pile at crosslink
  # sites, so flag-based dedup destroys real signal.
  - umi_tools             # unpinned — Skipper uses umicollapse for dedup, not umi_tools

  # ── UMIcollapse (Skipper se_dedup_umi rule) ─────────────────────────────
  # Skipper's se_dedup_umi rule calls `umicollapse` via java. Without
  # --use-conda the per-rule conda env is ignored, so both the tool and a
  # JVM must live in THIS env. The bioconda package installs the jar at
  # $PREFIX/share/umicollapse-*/umicollapse.jar, matching Skipper's glob.
  - umicollapse
  - openjdk>=17

  # ── BAM / BED processing ────────────────────────────────────────────────
  - samtools>=1.21        # >=1.21 has OpenSSL 3 builds; 1.5/1.20 linked against OpenSSL 1.0.x
  - bedtools=2.31.1
  - htslib>=1.21
  - pysam                 # version unpinned — resolves against python=3.12
  - sambamba=1.0.1

  # ── Quality control ─────────────────────────────────────────────────────
  - fastqc=0.12.1
  - multiqc=1.25.1
  - trim-galore=0.6.10
  - fastp                 # se_extract_umi rule: UMI extraction + QC JSON/HTML

  # ── Motif analysis ──────────────────────────────────────────────────────
  # HOMER identifies enriched k-mers in eCLIP binding sites (Fig. 2e, 2l)
  - homer=5.1
  - perl

  # ── Skipper Python dependencies ─────────────────────────────────────────
  - pandas=2.2.2
  - numpy=1.26.4
  - scipy=1.13.1
  - statsmodels=0.14.2
  - pybedtools=0.10.0
  - pyranges=0.0.129
  - click=8.1.7

  # ── bigWig generation (Skipper make_*_bigwig rules) ─────────────────────
  # bedGraphToBigWig + bc are both required by make_scaled_bigwig and
  # make_unscaled_bigwig. On a fresh env (openssl 3) ucsc-bedgraphtobigwig
  # installs cleanly. On an existing env with openssl 1.1.x, replace the
  # conda binary with the UCSC static binary (see README).
  - ucsc-bedgraphtobigwig
  - ucsc-bigwigtobedgraph   # needed by negate_minus_bigwigs.sh post-processing step
  - bc
  - deeptools=3.5.4

  # ── Compression & download ──────────────────────────────────────────────
  - pigz=2.8
  - wget
  - curl
  - sra-tools=3.1.1

  # ── R + Bioconductor packages ───────────────────────────────────────────
  # Bioconductor package versions are unpinned: the exact build numbers
  # that were failing (1.64.0, 1.56.x, 1.38.0) don't exist on bioconda
  # for this channel configuration. Let conda resolve compatible versions.
  - r-base=4.3.3
  - r-tidyverse
  - r-data.table
  - r-ggplot2
  - r-dplyr
  - r-stringr
  - r-ggrepel             # Skipper visualization scripts
  - r-cowplot             # Skipper multi-panel plot assembly
  - r-vgam                # fit_input_betabinomial_model
  - r-betareg             # fit_input_betabinomial_model
  - r-viridis             # call_enriched_windows.R color scales
  - r-desctools           # call_enriched_windows.R statistical utilities
  - r-ggdendro            # Skipper dendrogram plots
  - r-ggupset             # Skipper upset plots
  - r-glue                # string interpolation (also tidyverse dep)
  - r-magrittr            # pipe operator (also tidyverse dep)
  - r-rtsne               # Skipper t-SNE dimensionality reduction
  - bioconductor-rtracklayer      # required by Skipper GFF filter script
  - bioconductor-genomicranges
  - bioconductor-genomicfeatures
  - bioconductor-biocparallel

  # ── Git ─────────────────────────────────────────────────────────────────
  - git
